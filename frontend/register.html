<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker · Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">

    <script>
        // Apply the saved theme before first render to avoid a flash of the wrong theme.
        (function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
    <button id="themeToggle" class="icon-button theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>

    <div class="money-rain" aria-hidden="true">
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💵</span>
        <span class="coin">💰</span>
        <span class="coin">🪙</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💰</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💰</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
    </div>

    <main class="auth-wrapper">
        <div class="auth-card card">
            <h1>Create your account</h1>
            <p class="auth-subtitle">Start tracking your income and expenses today.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="password2">Confirm password</label>
                    <input type="password" id="password2" name="password2" required autocomplete="new-password">
                </div>
                <button type="submit" class="submit-button">Register</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="index.html">Log in</a></p>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script type="module" src="js/register.js"></script>
</body>
</html>
