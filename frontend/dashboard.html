<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
  <body>
   <header>
    <nav>
        <a href="categories.html">Categories</a>
        <a href="transactions.html">Transactions</a>
    </nav>
   </header>
    <main>
        <div id="periodNav">
            <label for="month">Month:</label>
            <select id="selectedMonth" name="month">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option> 
            </select>
            <label for="year">Year:</label>
            <select id="selectedYear" name="year">
                <option value="">Select a year</option>
            </select>
        </div>
        <div id="chart-card">
            <canvas id="myChart" class="my-chart"></canvas>
        </div>
        <div class="transactionsTable">
            <h2>Incomes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Date</th>
                    </tr> 
                </thead>
                <tbody id="incomeTransactionTableBody">
                </tbody>
            </table>
        </div>
        <div class="transactionsTable">
            <h2>Expenses</h2>
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Date</th>
                    </tr> 
                </thead>
                <tbody id="expenseTransactionTableBody">
                </tbody>
            </table>
        </div>
        <div class="transactionsTable">
            <h2>Investments</h2>
            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Date</th>
                    </tr> 
                </thead>
                <tbody id="investmentTransactionTableBody">
                </tbody>
            </table>
        </div>
        <button type="button" class="logout-button" id="logoutButton">Logout</button>
    </main>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
