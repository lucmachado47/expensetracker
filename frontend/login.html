<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker · Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">

    <script>
        // Apply the saved theme before first render to avoid a flash of the wrong theme.
        (function () {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
    <button id="themeToggle" class="icon-button theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>

    <div class="money-rain" aria-hidden="true">
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💵</span>
        <span class="coin">💰</span>
        <span class="coin">🪙</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💰</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
        <span class="coin">💰</span>
        <span class="coin">💵</span>
        <span class="coin">🪙</span>
    </div>

    <main class="auth-wrapper">
        <div class="auth-card card">
            <h1>Welcome back</h1>
            <p class="auth-subtitle">Sign in to keep track of your finances.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="submit-button">Log in</button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
        </div>
    </main>

    <script src="js/theme.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
